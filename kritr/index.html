<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KRITR | Oyuncu Merkezi</title>
    
    <!-- Fontlar: Logo için Orbitron, metinler için Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    
    <!-- İkonlar için FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Stiller -->
    <link rel="stylesheet" href="/kritr/assets/css/style.css">
</head>
<body>
    
    <!-- Uygulama Çerçevesi -->
    <div class="app-container">
        
        <nav class="navigation">
            <a href="javascript:void(0)" class="nav-item" data-target="discounts" onclick="navigate('discounts')">
                <i class="fas fa-percentage"></i>
            </a>
            <a href="javascript:void(0)" class="nav-item" data-target="favorites" onclick="navigate('favorites')">
                <i class="fas fa-bookmark"></i>
            </a>
            <a href="javascript:void(0)" class="nav-item active" data-target="home" onclick="navigate('home')">
                <i class="fas fa-home"></i>
            </a>
            <a href="javascript:void(0)" class="nav-item" data-target="settings" onclick="navigate('settings')">
                <i class="fas fa-cog"></i>
            </a>
            <a href="javascript:void(0)" class="nav-item" data-target="discover" onclick="navigate('discover')">
                <i class="fas fa-compass"></i>
            </a>
        </nav>

        <!-- İçerik Sarıcı (Masaüstünde Nav'ın yanında durur) -->
        <div class="content-wrapper">
            <!-- Üst Başlık (Header) -->
            <header class="top-header">
                <div class="header-content">
                    <div class="logo" onclick="navigate('home')">KRITR</div>
                    
                    <div class="search-container">
                        <input type="text" placeholder="Search a game..." id="search-input">
                        <i class="fas fa-search search-icon"></i>
                    </div>
                    
                    <div class="profile-container" id="auth-container">
                        <!-- Oturum durumuna göre JS ile doldurulacak (Giriş Yap butonu veya Avatar) -->
                        <button class="login-btn-header" onclick="navigate('login')" style="display: none;">Giriş Yap</button>
                        <div class="profile-avatar" id="profile-avatar-btn" style="display: none;" onclick="toggleProfileMenu()">
                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=KRITR" alt="Profile">
                        </div>
                        
                        <!-- Profil Menüsü (Çıkış Yap vb.) -->
                        <div class="profile-dropdown" id="profile-dropdown" style="display: none;">
                            <div class="dropdown-item" id="user-email-display"></div>
                            <div class="dropdown-divider"></div>
                            <div class="dropdown-item text-danger" onclick="doLogout()">
                                <i class="fas fa-sign-out-alt"></i> Çıkış Yap
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- İçerik Alanı (SPA View) -->
            <main id="app-view" class="main-content">
                <!-- Sayfa içerikleri buraya JavaScript ile yüklenecek -->
            </main>
        </div>
    </div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Uygulama Mantığı -->
    <script src="/kritr/assets/js/app.js?v=1.1.5"></script>
    
    <!-- Sürüm Numarası -->
    <div style="position: fixed; bottom: 10px; right: 15px; color: rgba(255,255,255,0.15); font-size: 11px; z-index: 999; font-family: 'Orbitron', sans-serif; pointer-events: none;">v1.1.5</div>
</body>
</html>
